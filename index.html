<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mendcraft — hands-free 3D builder</title>

    <!-- PWA: installable lamp & music remote (start_url /phone). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#13131a" />
    <!-- iOS "Add to Home Screen": apple-touch-icon must be a PNG; iOS ignores
         the SVG favicon and the manifest icons for the home-screen tile. -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mendcraft" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
